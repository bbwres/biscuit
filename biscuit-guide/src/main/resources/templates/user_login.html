<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | 多方式登录体验</title>
    <!-- Tailwind CSS -->
    <script src="/static/tailwindcss-3.4.17.js"></script>
    <!-- Font Awesome -->
    <link href="/static/font-awesome.min.css" rel="stylesheet">
<!--    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">-->

    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#6B7280',
                        accent: '#3B82F6',
                        neutral: '#F3F4F6',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>

    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }

            .bg-gradient-custom {
                background: linear-gradient(135deg, rgba(22, 93, 255, 0.9), rgba(59, 130, 246, 0.8));
            }

            .backdrop-blur-custom {
                backdrop-filter: blur(0px);
            }

            .shadow-custom {
                box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
            }

            .transition-custom {
                transition: all 0.3s ease;
            }
        }
    </style>

    <style>
        /* 导入字体 */
        @import url('/static/css2.css');

        /* 全局样式 */
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1s ease-in-out;
        }

        /* 动画效果 */
        .form-input:focus {
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(22, 93, 255, 0.4);
        }

        .social-btn:hover {
            transform: translateY(-2px);
        }

        /* 登录方式切换动画 */
        .login-tab {
            transition: all 0.3s ease;
        }

        .login-panel {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 加载动画 */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        /* 验证码倒计时 */
        @keyframes countdown {
            0% {
                width: 100%;
            }
            100% {
                width: 0%;
            }
        }

        .countdown-bar {
            animation: countdown 60s linear forwards;
        }

        /* 登录框位置调整 */
        .login-container {
            transition: justify-content 0.5s ease;
        }

        /* 图形验证码 */
        .captcha-container {
            display: flex;
            align-items: center;
        }

        .captcha-image {
            width: 120px;
            height: 44px;
            margin-left: 10px;
            border-radius: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        /* 模态框动画 */
        .modal-enter {
            animation: modalEnter 0.3s ease forwards;
        }

        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-backdrop {
            backdrop-filter: blur(5px);
        }

        #footer {
            backdrop-filter: blur(0px);
            padding: 1rem 0; /* 增加上下内边距 */
            width: 100%; /* 确保宽度为100% */
        }
    </style>
</head>
<body class="min-h-screen bg-neutral font-inter antialiased" id="login-bg">
<!-- 背景遮罩 -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-custom z-0"></div>

<!-- 新增：右上角语言切换器 -->
<div class="fixed top-6 right-6 z-20">
    <div class="relative inline-block text-left">
        <button type="button" id="language-button"
                class="bg-white/90 hover:bg-white text-gray-800 px-2  rounded-lg shadow-md flex items-center space-x-2 transition-custom">
            <i class="fa fa-globe"></i>
            <span id="current-language-text">中文</span>
            <i class="fa fa-chevron-down text-xs"></i>
        </button>

        <div id="language-dropdown"
             class="hidden origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50">
            <div class="py-1" role="menu" aria-orientation="vertical" aria-labelledby="language-button">
                <a href="#"
                   class="language-option block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900"
                   role="menuitem" data-lang="zh-CN">中文</a>
                <a href="#"
                   class="language-option block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900"
                   role="menuitem" data-lang="en-US">English</a>
                <a href="#"
                   class="language-option block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900"
                   role="menuitem" data-lang="ja-JP">日本語</a>
                <a href="#"
                   class="language-option block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900"
                   role="menuitem" data-lang="ko-KR">한국어</a>
            </div>
        </div>
    </div>
</div>


<!-- 主容器 -->
<div class="relative min-h-screen flex flex-col items-center justify-center px-4 py-12 z-10">
    <!-- 登录卡片容器，用于位置调整 -->
    <div id="login-container" class="w-full max-w-6xl flex justify-center">
        <!-- 登录卡片 -->
        <div class="w-full max-w-md">
            <div class="bg-white/95 backdrop-blur-custom rounded-2xl shadow-custom overflow-hidden">
                <!-- 卡片头部 -->
                <div class="p-3 border-b border-gray-100">
                    <div class="text-center mb-2">
                        <h1 class="text-[clamp(1.5rem,4vw,2rem)] font-bold text-gray-800" data-i18n="welcome_back">
                            欢迎回来</h1>
                        <p class="text-secondary" data-i18n="login_prompt">请使用以下方式登录您的账户</p>
                    </div>
                </div>

                <!-- 登录方式选择器 -->
                <div class="px-6 pt-3 border-b border-gray-100">
                    <div class="flex">
                        <button id="password-tab"
                                class="login-tab flex-1 py-3 text-center font-medium text-primary border-b-2 border-primary">
                            <span data-i18n="password_login">账号密码</span>
                        </button>
                        <button id="phone-tab"
                                class="login-tab flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition-custom">
                            <span data-i18n="phone_login">手机号登录</span>
                        </button>
                        <button id="qrcode-tab"
                                class="login-tab flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition-custom">
                            <span data-i18n="qrcode_login">扫码登录</span>
                        </button>
                    </div>
                </div>

                <!-- 登录表单容器 -->
                <div class="p-6">
                    <!-- 账号密码登录面板 -->
                    <div id="password-panel" class="login-panel space-y-6">
                        <form id="password-form">
                            <!-- 用户名/邮箱输入框 -->
                            <div>
                                <label for="username" class="block text-sm font-medium text-gray-700 mb-1"
                                       data-i18n="username_or_email">用户名或邮箱</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                        <i class="fa fa-user"></i>
                                    </div>
                                    <input type="text" id="username" name="username"
                                           class="form-input block w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom outline-none"
                                           data-i18n-placeholder="username_or_email"  placeholder="请输入用户名或邮箱" required>
                                </div>
                            </div>

                            <!-- 密码输入框 -->
                            <div>
                                <label for="password" class="block text-sm font-medium text-gray-700 mb-1"
                                       data-i18n="password">密码</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                        <i class="fa fa-lock"></i>
                                    </div>
                                    <input type="password" id="password" name="password"
                                           class="form-input block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom outline-none"
                                           placeholder="请输入密码" data-i18n-placeholder="password"  required>
                                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer text-gray-400 hover:text-gray-600"
                                         id="toggle-password">
                                        <i class="fa fa-eye-slash" id="password-icon"></i>
                                    </div>
                                </div>
                            </div>

                            <!-- 图形验证码（初始隐藏，密码错误3次后显示） -->
                            <div id="password-captcha-container" class="hidden">
                                <label for="password-captcha" class="block text-sm font-medium text-gray-700 mb-1"
                                       data-i18n="captcha">图形验证码</label>
                                <div class="captcha-container">
                                    <div class="relative flex-1">
                                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                            <i class="fa fa-shield"></i>
                                        </div>
                                        <input type="text" id="password-captcha" name="password-captcha"
                                               class="form-input block w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom outline-none"
                                               placeholder="请输入图形验证码"  data-i18n-placeholder="captcha"  >
                                    </div>
                                    <div id="password-captcha-image"
                                         class="captcha-image bg-gray-200 flex items-center justify-center text-gray-600"
                                         data-i18n="click_to_refresh">点击刷新
                                    </div>
                                </div>
                            </div>

                            <!-- 记住我和忘记密码 -->
                            <div class="pt-4 flex items-center justify-between">
                                <div class="flex items-center">
                                    <input id="remember-me" name="remember-me" type="checkbox"
                                           class="h-4 w-4 text-primary focus:ring-primary/50 border-gray-300 rounded">
                                    <label for="remember-me" class="ml-2 block text-sm text-gray-700"
                                           data-i18n="remember_me">记住我</label>
                                </div>
                                <div class="text-sm">
                                    <a href="#" class="font-medium text-primary hover:text-primary/80 transition-custom"
                                       data-i18n="forgot_password">忘记密码?</a>
                                </div>
                            </div>

                            <!-- 登录按钮 - 与输入框有明确间隔 -->
                            <div class="pt-4">
                                <button type="submit" id="password-login-button"
                                        class="btn-primary w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-custom">
                                    <span id="password-login-text" data-i18n="login">登录</span>
                                    <span id="password-login-spinner" class="ml-2 hidden"><i
                                            class="fa fa-circle-o-notch fa-spin"></i></span>
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- 手机号登录面板 -->
                    <div id="phone-panel" class="login-panel space-y-6 hidden">
                        <form id="phone-form">
                            <!-- 手机号输入框 -->
                            <div>
                                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1"
                                       data-i18n="phone_number">手机号</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                        <i class="fa fa-phone"></i>
                                    </div>
                                    <input type="tel" id="phone" name="phone"
                                           class="form-input block w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom outline-none"
                                           placeholder="请输入手机号" data-i18n-placeholder="phone_number" required>
                                </div>
                            </div>

                            <!-- 短信验证码输入框 -->
                            <div>
                                <label for="verify-code" class="block text-sm font-medium text-gray-700 mb-1"
                                       data-i18n="verify_code">短信验证码</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                        <i class="fa fa-mobile"></i>
                                    </div>
                                    <input type="text" id="verify-code" name="verify-code"
                                           class="form-input block w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom outline-none"
                                           placeholder="请输入短信验证码" data-i18n-placeholder="verify_code" required>
                                    <button type="button" id="send-code-button"
                                            class="absolute inset-y-0 right-0 flex items-center px-4 text-sm font-medium text-primary hover:text-primary/80 transition-custom">
                                        <span data-i18n="get_code">获取验证码</span>
                                    </button>
                                </div>
                                <div id="countdown-container"
                                     class="mt-1 h-1 w-full bg-gray-200 rounded-full overflow-hidden hidden">
                                    <div id="countdown-bar" class="h-full bg-primary"></div>
                                </div>
                                <p id="code-sent" class="mt-1 text-xs text-green-600 hidden" data-i18n="code_sent">
                                    验证码已发送至您的手机，请注意查收</p>
                            </div>

                            <!-- 登录按钮 - 与输入框有明确间隔 -->
                            <div class="pt-4">
                                <button type="submit" id="phone-login-button"
                                        class="btn-primary w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-custom">
                                    <span id="phone-login-text" data-i18n="login">登录</span>
                                    <span id="phone-login-spinner" class="ml-2 hidden"><i
                                            class="fa fa-circle-o-notch fa-spin"></i></span>
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- 扫码登录面板 -->
                    <div id="qrcode-panel" class="login-panel space-y-6 hidden">
                        <div class="text-center">
                            <div class="inline-block p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
                                <!-- 模拟二维码 -->
                                <div class="w-48 h-48 bg-white relative">
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <div class="w-40 h-40 border-8 border-primary rounded-lg flex items-center justify-center">
                                            <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center">
                                                <div class="w-8 h-8 bg-white rounded-full"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- 二维码角落 -->
                                    <div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary"></div>
                                    <div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary"></div>
                                    <div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary"></div>
                                    <div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary"></div>
                                </div>
                            </div>

                            <p class="mt-4 text-sm text-gray-600" data-i18n="scan_qrcode">请使用手机App扫码登录</p>
                            <button type="button" id="refresh-qrcode"
                                    class="mt-4 text-primary hover:text-primary/80 text-sm font-medium">
                                <i class="fa fa-refresh mr-1"></i> <span data-i18n="refresh_qrcode">刷新二维码</span>
                            </button>
                        </div>

                    </div>

                    <!-- 注册链接 -->
                    <div class="mt-6 text-center">
                        <p class="text-sm text-gray-600" data-i18n="no_account">
                            还没有账户? <a href="#"
                                           class="font-medium text-primary hover:text-primary/80 transition-custom"
                                           data-i18n="register_now">立即注册</a>
                        </p>
                    </div>
                </div>
            </div>


        </div>
    </div>
    <!-- 页脚 -->
    <div id="footer" class="mt-8 text-center text-gray-400 text-sm pt-8 backdrop-blur-custom">
        <p data-i18n="copyright">© 2025 您的公司名称. 保留所有权利.</p>
        <div class="mt-2 space-x-4">
            <a href="#" class="hover:text-white transition-custom" data-i18n="privacy_policy">隐私政策</a>
            <a href="#" class="hover:text-white transition-custom" data-i18n="terms_of_service">服务条款</a>
            <a href="#" class="hover:text-white transition-custom" data-i18n="contact_us">联系我们</a>
        </div>
    </div>
</div>


<!-- 图形验证码模态框 -->
<div id="captcha-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50 modal-backdrop"></div>
    <div class="relative min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden modal-enter transform transition-all">
            <div class="p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4" data-i18n="verify_identity">验证您的身份</h3>

                <div class="space-y-4">
                    <div>
                        <p class="text-sm text-gray-600 mb-3" data-i18n="verify_prompt">
                            请完成以下验证，以确保您不是机器人</p>

                        <div class="captcha-container">
                            <div class="relative flex-1">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                    <i class="fa fa-shield"></i>
                                </div>
                                <input type="text" id="modal-captcha"
                                       class="form-input block w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom outline-none"
                                       placeholder="请输入图形验证码" data-i18n-placeholder="captcha_required" required>
                            </div>
                            <div id="modal-captcha-image"
                                 class="captcha-image bg-gray-200 flex items-center justify-center text-gray-600"
                                 data-i18n="click_to_refresh">点击刷新
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 flex space-x-3">
                        <button type="button" id="modal-cancel"
                                class="flex-1 py-3 px-4 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-custom"
                                data-i18n="cancel">取消
                        </button>
                        <button type="button" id="modal-confirm"
                                class="flex-1 py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-custom"
                                data-i18n="confirm">确认
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    // 国际化语言包
    const translations = {

            upload_custom_bg: '上传自定义背景',

            login_success: '登录成功！（这只是一个前端演示）',
            qrcode_expired: '二维码已过期，请刷新',
            verify_identity: '验证您的身份',
            verify_prompt: '请完成以下验证，以确保您不是机器人',
            cancel: '取消',
            confirm: '确认'
        },
        'en-US': {

    // 更新主题颜色
    function updateThemeColor(color) {
        // 更新CSS变量
        document.documentElement.style.setProperty('--tw-color-primary', color);

        // 更新元素颜色
        const primaryElements = document.querySelectorAll('.btn-primary, .text-primary, .focus\\:ring-primary\\/50, .focus\\:border-primary');
        primaryElements.forEach(el => {
            if (el.classList.contains('btn-primary')) {
                el.style.backgroundColor = color;
                el.style.borderColor = color;
            }
            if (el.classList.contains('text-primary')) {
                el.style.color = color;
            }
        });
    }

    // 更新语言
    function updateLanguage(lang) {
        document.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                // 处理包含占位符的文本
                if (translations[lang][key].includes('{count}')) {
                    element.innerHTML = translations[lang][key].replace('{count}', '<span id="expiry-count">60</span>');
                } else if (translations[lang][key].includes('{link}')) {
                    // 处理包含链接的文本
                    const linkText = element.querySelector('a') ? element.querySelector('a').getAttribute('data-i18n') : '';
                    const linkHtml = `<a href="#" class="font-medium text-primary hover:text-primary/80 transition-custom" data-i18n="${linkText}">${translations[lang][linkText] || linkText}</a>`;
                    element.innerHTML = translations[lang][key].replace('{link}', linkHtml);
                } else {
                    element.textContent = translations[lang][key];
                }
            }
        });
        // 2. 新增：更新所有带有 data-i18n-placeholder 属性的元素的 placeholder
        document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
            const key = element.getAttribute('data-i18n-placeholder');
            if (translations[lang] && translations[lang][key]) {
                element.placeholder = translations[lang][key];
            }
        });
    }

    // 生成图形验证码
    function generateCaptcha(element) {
        // 创建画布
        const canvas = document.createElement('canvas');
        canvas.width = 120;
        canvas.height = 44;
        const ctx = canvas.getContext('2d');

        // 设置背景色
        ctx.fillStyle = getRandomColor(240, 255);
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制干扰线
        for (let i = 0; i < 5; i++) {
            ctx.strokeStyle = getRandomColor(150, 200);
            ctx.beginPath();
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.stroke();
        }

        // 绘制干扰点
        for (let i = 0; i < 50; i++) {
            ctx.fillStyle = getRandomColor(50, 150);
            ctx.beginPath();
            ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, 2 * Math.PI);
            ctx.fill();
        }

        // 生成随机验证码
        const code = generateRandomCode(4);

        // 绘制验证码
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // 每个字符使用不同颜色和旋转角度
        for (let i = 0; i < code.length; i++) {
            const char = code.charAt(i);
            ctx.fillStyle = getRandomColor(50, 150);

            // 轻微旋转每个字符
            const x = 30 + i * 20;
            const y = canvas.height / 2;
            const angle = (Math.random() - 0.5) * 0.3;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillText(char, 0, 0);
            ctx.restore();
        }

        // 将验证码存储在元素上
        element.dataset.captcha = code.toLowerCase();

        // 清除之前的内容并添加画布
        element.innerHTML = '';
        element.appendChild(canvas);
    }

    // 生成随机颜色
    function getRandomColor(min, max) {
        const r = Math.floor(Math.random() * (max - min + 1)) + min;
        const g = Math.floor(Math.random() * (max - min + 1)) + min;
        const b = Math.floor(Math.random() * (max - min + 1)) + min;
        return `rgb(${r}, ${g}, ${b})`;
    }

    // 生成随机验证码
    function generateRandomCode(length) {
        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        let code = '';
        for (let i = 0; i < length; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    // 密码登录表单提交
    passwordForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = passwordInput.value.trim();

        if (!username) {
            alert(translations[currentLang].username_or_email || '请输入用户名或邮箱');
            return;
        }

        if (!password) {
            alert(translations[currentLang].password || '请输入密码');
            return;
        }

        // 检查是否需要验证码
        let captchaValid = true;
        if (passwordErrorCount >= 3) {
            const userCaptcha = passwordCaptcha.value.trim().toLowerCase();
            const actualCaptcha = passwordCaptchaImage.dataset.captcha;

            if (!userCaptcha) {
                alert(translations[currentLang].captcha_required || '请输入图形验证码');
                return;
            }

            if (userCaptcha !== actualCaptcha) {
                alert(translations[currentLang].captcha_incorrect || '图形验证码不正确');
                generateCaptcha(passwordCaptchaImage);
                passwordCaptcha.value = '';
                captchaValid = false;
            }
        }

        if (!captchaValid) {
            return;
        }

        // 显示加载状态
        passwordLoginButton.classList.add('opacity-75');
        passwordLoginText.textContent = translations[currentLang].logging_in || '登录中';

            // 重置按钮状态
            passwordLoginButton.classList.remove('opacity-75');
            passwordLoginText.textContent = translations[currentLang].login || '登录';
            passwordLoginSpinner.classList.add('hidden');
            passwordLoginButton.disabled = false;

            // 模拟密码错误
            if (username !== 'admin' || password !== 'password') {
                passwordErrorCount++;

                // 密码错误3次后显示验证码
                if (passwordErrorCount >= 3) {

                if (passwordCaptchaContainer.classList.contains('hidden') === false) {
                    passwordCaptcha.value = '';
                }
            } else {
                // 模拟登录成功
                alert(translations[currentLang].login_success || '登录成功！（这只是一个前端演示）');

                // 重置密码错误计数

                passwordCaptchaContainer.classList.add('hidden');
            }
        }, 1500);

        }

        if (!/^1[3-9]\d{9}$/.test(phone) && currentLang === 'zh-CN') {
            alert(translations[currentLang].phone_error || '请输入有效的手机号');
            phoneInput.focus();
            return;
        }

        // 保存当前手机号，用于后续验证
        captchaModal.dataset.phone = phone;

        // 重置模态框验证码
        generateCaptcha(modalCaptchaImage);
        modalCaptcha.value = '';

        // 显示模态框
        captchaModal.classList.remove('hidden');
        modalCaptcha.focus();
    });

    // 验证码模态框确认按钮
    modalConfirm.addEventListener('click', () => {
        const userCaptcha = modalCaptcha.value.trim().toLowerCase();
        const actualCaptcha = modalCaptchaImage.dataset.captcha;

        if (!userCaptcha) {
            alert(translations[currentLang].captcha_required || '请输入图形验证码');
            modalCaptcha.focus();
            return;
        }

        if (userCaptcha !== actualCaptcha) {
            alert(translations[currentLang].captcha_incorrect || '图形验证码不正确');
            generateCaptcha(modalCaptchaImage);
            modalCaptcha.value = '';
            modalCaptcha.focus();
            return;
        }

        // 隐藏模态框
        captchaModal.classList.add('hidden');

        // 模拟发送验证码
        sendCodeButton.disabled = true;
        sendCodeButton.innerHTML = '<span data-i18n="sending">发送中...</span>';
        setTimeout(() => {
            sendCodeButton.innerHTML = '<span style="color: #ccc" data-i18n="get_code">获取验证码</span>';
            countdownContainer.classList.remove('hidden');
            countdownBar.classList.add('countdown-bar');
            codeSent.classList.remove('hidden');

            // 60秒后恢复按钮
            setTimeout(() => {
                sendCodeButton.disabled = false;
                sendCodeButton.innerHTML = '<span data-i18n="get_code" >获取验证码</span>';
                countdownContainer.classList.add('hidden');
                countdownBar.classList.remove('countdown-bar');
                codeSent.classList.add('hidden');
            }, 60000);
        }, 1000);
    });

    // 验证码模态框取消按钮
    modalCancel.addEventListener('click', () => {
        captchaModal.classList.add('hidden');
    });

    // 点击模态框背景关闭
    captchaModal.addEventListener('click', (e) => {
        if (e.target === captchaModal) {
            captchaModal.classList.add('hidden');
        }
    });

    // 模态框验证码图片点击刷新
    modalCaptchaImage.addEventListener('click', () => {
        generateCaptcha(modalCaptchaImage);
        modalCaptcha.value = '';
    });

    // 手机号登录表单提交
    phoneForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const phone = phoneInput.value.trim();
        const code = verifyCodeInput.value.trim();

        if (!phone) {
            alert(translations[currentLang].phone_number || '请输入手机号');
            return;
        }

        if (!/^1[3-9]\d{9}$/.test(phone) && currentLang === 'zh-CN') {
            alert(translations[currentLang].phone_error || '请输入有效的手机号');
            return;
        }

        if (!code) {
            alert(translations[currentLang].verify_code || '请输入短信验证码');
            return;
        }

        if (code.length !== 6) {
            alert(translations[currentLang].code_error || '请输入6位验证码');
            return;
        }

        // 显示加载状态
        phoneLoginButton.classList.add('opacity-75');
        phoneLoginText.textContent = translations[currentLang].logging_in || '登录中';
        phoneLoginSpinner.classList.remove('hidden');
        phoneLoginButton.disabled = true;

        // 模拟登录请求
        setTimeout(() => {
            // 重置按钮状态
            phoneLoginButton.classList.remove('opacity-75');
            phoneLoginText.textContent = translations[currentLang].login || '登录';
            phoneLoginSpinner.classList.add('hidden');
            phoneLoginButton.disabled = false;

            // 模拟登录成功
            alert(translations[currentLang].login_success || '登录成功！（这只是一个前端演示）');
        }, 1500);
    });

    // 验证码图片点击刷新
    passwordCaptchaImage.addEventListener('click', () => {
        generateCaptcha(passwordCaptchaImage);
        passwordCaptcha.value = '';
    });

    // 点击语言按钮，切换下拉菜单显示/隐藏
    languageButton.addEventListener('click', () => {
        languageDropdown.classList.toggle('hidden');
    });

    // 点击语言选项
    languageOptions.forEach(option => {
        option.addEventListener('click', (e) => {
            e.preventDefault(); // 阻止 a 标签的默认跳转行为

            const selectedLang = option.getAttribute('data-lang');
            if (selectedLang !== currentLang) {
                currentLang = selectedLang;
                localStorage.setItem('language', currentLang);
                updateLanguage(currentLang);
                updateLanguageButtonText(); // 更新按钮上显示的语言
            }

            // 隐藏下拉菜单
            languageDropdown.classList.add('hidden');
        });
    });

    // 点击页面其他地方，关闭下拉菜单
    document.addEventListener('click', (e) => {
        if (!languageButton.contains(e.target) && !languageDropdown.contains(e.target)) {
            languageDropdown.classList.add('hidden');
        }
    });

    // 新增：更新语言按钮上显示的文本
    function updateLanguageButtonText() {
        const langNames = {
            'zh-CN': '中文',
            'en-US': 'English',
            'ja-JP': '日本語',
            'ko-KR': '한국어'
        };
        currentLanguageText.textContent = langNames[currentLang];
    }


    // 刷新二维码
    refreshQrcode.addEventListener('click', () => {
        // 模拟刷新二维码
        refreshQrcode.disabled = true;
        refreshQrcode.innerHTML = '<i class="fa fa-refresh fa-spin mr-1"></i> <span data-i18n="refreshing">刷新中...</span>';

        setTimeout(() => {
            refreshQrcode.disabled = false;
            refreshQrcode.innerHTML = '<i class="fa fa-refresh mr-1"></i> <span data-i18n="refresh_qrcode">刷新二维码</span>';
        }, 1000);
    });


    // 页面加载动画
    window.addEventListener('load', () => {
        document.body.classList.add('opacity-100');
        document.body.classList.remove('opacity-0');
    });

</script>
</body>
</html>
